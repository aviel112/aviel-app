    g.onclick=function(){ var v=ov.querySelector('#vcV'), val=v?v.value.trim():'', num=Number(String(val).replace(/[^\d.]/g,'')), n=c.name, f=n.split(' ')[0];
      if(c.action==='card'){ close(); openCard(n); return; }
      if(!txt&&!(num>0)){ toast('צריך מספר'); return; } if(txt&&!val){ toast('ריק'); return; }
      g.disabled=true; g.textContent='מבצע…';
      var job= c.action==='steps'?gsr('dashboardStepsGoal',n,num):c.action==='kcal'?gsr('dashboardKcalSet',n,num):c.action==='water'?gsr('dashboardWaterGoal',n,num):c.action==='goalKg'?gsr('dashboardGoalKg',n,num):c.action==='focus'?gsr('dashboardFocus',n,val):c.action==='note'?gsr('dashboardNote',n,val):(c.phone?gsr('dashboardWaSend',c.phone,val,n):Promise.reject(new Error('אין טלפון ל'+f)));
      job.then(function(){ close(); try{ delete CARD[n]; }catch(e){} toast('בוצע: '+ACT[c.action]+' ל'+f); }).catch(function(e){ g.disabled=false; g.textContent='ביצוע'; toast(e.message||String(e)); }); };
  }
  var t0=setInterval(function(){ if(document.querySelector('.top')){ qsMount(); clearInterval(t0); } },300);
})();
</script>

<style>

.om-ch.up{background:var(--orange-l);color:var(--orange)}.om-ch.dn{background:var(--green-l);color:var(--green)}.om-ch.eq{background:var(--chip);color:var(--chip-t)}
.om-svg{width:100%;height:150px;display:block;margin-top:6px}

<script>
/* ===== מסך ראשי בכרטיס (29.10.26, בהשראת Progress — אביאל: "מה שיש להם שאין לנו, שיהיה לי כמה שיותר נוח") ===== */
(function(){
  var OVC={}, OVS={m:'kg',r:30};
  function agoTxt(ms){ if(!ms) return null; var h=(Date.now()-ms)/36e5; return h<1?'לפני פחות משעה':h<24?'לפני '+Math.round(h)+' שעות':Math.round(h/24)===1?'אתמול':'לפני '+Math.round(h/24)+' ימים'; }
  function seenCls(o){ var ms=o.seenAt||(o.seen?new Date(o.seen+'T12:00:00').getTime():0); if(!ms) return 'r'; var h=(Date.now()-ms)/36e5; return h<30?'g':h<72?'o':'r'; }
  function series(o){ var m=OVS.m, src=m==='kg'?o.hist.filter(function(x){ return x[1]!=null; }).map(function(x){ return [x[0],x[1]]; }):m==='st'?o.hist.filter(function(x){ return x[2]!=null; }).map(function(x){ return [x[0],x[2]]; }):m==='wa'?o.water.map(function(x){ return [x[0],x[1]/1000]; }):o.sleep;
    if(OVS.r){ var c=new Date(); c.setDate(c.getDate()-OVS.r); var cs=c.toISOString().slice(0,10); src=src.filter(function(x){ return x[0]>=cs; }); } return src; }
  function avg(a){ return a.length?a.reduce(function(s,x){ return s+x; },0)/a.length:null; }
  function weekCh(o){ var all=series({hist:o.hist,water:o.water,sleep:o.sleep}), d=new Date(), k=function(n){ var x=new Date(d); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); };
    var a=avg(all.filter(function(x){ return x[0]>k(7); }).map(function(x){ return x[1]; })), b=avg(all.filter(function(x){ return x[0]>k(14)&&x[0]<=k(7); }).map(function(x){ return x[1]; })); return a!=null&&b!=null?a-b:null; }
  function chart(s,goal){ if(s.length<2) return '<div class="om-e">'+(s.length?'נקודה אחת עד עכשיו. הגרף יופיע מהמדידה השנייה.':'אין עדיין נתונים בטווח הזה.')+'</div>';
    var W=600,H=150,P=8, ys=s.map(function(x){ return x[1]; }).concat(goal?[goal]:[]), mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys); if(mx-mn<0.5){ mx+=0.5; mn-=0.5; } var pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
    var t0=new Date(s[0][0]).getTime(), t1=new Date(s[s.length-1][0]).getTime()||t0+1, X=function(d){ return W-P-((new Date(d).getTime()-t0)/Math.max(1,t1-t0))*(W-2*P); }, Y=function(v){ return H-P-((v-mn)/(mx-mn))*(H-2*P); };
    var pts=s.map(function(x){ return X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1); }), ma=[]; s.forEach(function(x,i){ var w=s.slice(Math.max(0,i-6),i+1).map(function(z){ return z[1]; }); ma.push(X(x[0]).toFixed(1)+','+Y(avg(w)).toFixed(1)); });
    var lab=function(v){ return Math.abs(v)>=1000?Math.round(v/100)/10+'K':(Math.round(v*10)/10); };
    return '<svg class="om-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="גרף">'+(goal?'<line x1="0" x2="'+W+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'" stroke="var(--green)" stroke-dasharray="6 6" stroke-width="1.5" vector-effect="non-scaling-stroke"/>':'')+
      '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--mute)" stroke-opacity=".45" stroke-width="1.5" vector-effect="non-scaling-stroke"/>'+(s.length>=5?'<polyline points="'+ma.join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>':'')+
      s.map(function(x){ return '<circle cx="'+X(x[0]).toFixed(1)+'" cy="'+Y(x[1]).toFixed(1)+'" r="2.6" fill="var(--blue)"/>'; }).join('')+'</svg>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mute)"><span>'+s[0][0].slice(8,10)+'/'+s[0][0].slice(5,7)+'</span><span>'+(goal?'יעד '+lab(goal)+' · ':'')+(s.length>=5?'קו כחול = ממוצע 7 ימים':'')+'</span><span>'+s[s.length-1][0].slice(8,10)+'/'+s[s.length-1][0].slice(5,7)+'</span></div>'; }
  function draw(box,o){ var M={kg:['משקל','ק״ג',o.goalKg||0],st:['צעדים','',o.stepsGoal||0],wa:['מים','ליטר',(o.waterGoal||0)/1000],sl:['שינה','שעות',7.5]}, m=M[OVS.m], s=series(o), last=s.length?s[s.length-1][1]:null, wc=weekCh(o), sc=seenCls(o);
    var fmt=function(v){ return v==null?'—':OVS.m==='st'?Math.round(v).toLocaleString('en'):Math.round(v*10)/10; };
    var chTxt=wc==null?'':'<span class="om-ch '+(Math.abs(wc)<(OVS.m==='st'?200:0.05)?'eq':(wc>0)===(OVS.m==='kg')?'up':'dn')+'">'+(wc>0?'+':'')+fmt(wc)+' מהשבוע שעבר</span>';
    var n=o.nut, tk=o.macros&&o.macros.k, mc=o.macros||{}, pc=function(v,t){ return t?Math.min(100,Math.round(v/t*100)):0; };
    var ring=function(v,t){ var r=38, C=2*Math.PI*r, f=t?Math.min(1,v/t):0, col=t&&v>t*1.1?'var(--orange)':'var(--blue)'; return '<svg viewBox="0 0 96 96" width="96" height="96"><circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="48" cy="48" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(C*f).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 48 48)"/><text x="48" y="47" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)">'+(v||'—')+'</text><text x="48" y="64" text-anchor="middle" font-size="10.5" fill="var(--mute)">'+(t?'מתוך '+t:'קק״ל')+'</text></svg>'; };
    var row=function(l,v,t,col){ return '<div class="rw"><span>'+l+'</span><div class="bar"><i style="width:'+(t?pc(v,t):Math.min(100,v))+'%;background:'+col+'"></i></div><b>'+v+(t?' / '+t:'')+' ג׳</b></div>'; };
    box.innerHTML='<div class="om-h"><span class="'+sc+'">'+(agoTxt(o.seenAt)?'נכנס/ה '+agoTxt(o.seenAt):o.seen?'נכנס/ה ב-'+o.seen.slice(8,10)+'/'+o.seen.slice(5,7):'עוד לא נכנס/ה לאפליקציה')+'</span>'+(o.dIn?'<span>יום '+o.dIn+' בתהליך</span>':'')+(o.goal?'<span>'+esc(o.goal)+(o.goalKg?' · יעד '+o.goalKg+' ק״ג':'')+'</span>':'')+'</div>'+
      '<div class="om-c"><div class="om-t"><b>מעקב נתונים</b><div class="om-seg" data-om="m">'+[['kg','משקל'],['st','צעדים'],['wa','מים'],['sl','שינה']].map(function(x){ return '<button type="button" data-v="'+x[0]+'" class="'+(OVS.m===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</div></div>'+
      '<div class="om-big"><b>'+fmt(last)+'</b><small>'+m[1]+(OVS.m==='kg'?' · אחרון':' · אחרון')+'</small>'+chTxt+'</div>'+chart(s,m[2])+
      '<div class="om-seg" data-om="r" style="margin-top:6px">'+[[30,'חודש'],[90,'3 חודשים'],[0,'הכל']].map(function(x){ return '<button type="button" data-v="'+x[0]+'" class="'+(OVS.r===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</div></div>'+
      '<div class="om-c"><div class="om-t"><b>תזונה · ממוצע 7 ימים</b><small style="color:var(--mute)">'+(n?n.days+'/7 ימים עם יומן'+(n.hit!=null&&n.days?' · '+n.hit+' ביעד':''):'')+'</small></div>'+
      (n&&n.days?'<div class="om-n">'+ring(n.k,tk)+'<div class="rows">'+row('חלבון',n.p,mc.p,'var(--blue)')+row('פחמימה',n.c,mc.c,'var(--green)')+row('שומן',n.f,mc.f,'var(--orange)')+'</div></div>':'<div class="om-e">'+(o.mode==='תפריט'?'עובד/ת לפי תפריט, ולא רשם/ה יומן אוכל השבוע.':'אין רישומים ביומן האוכל בשבוע האחרון.')+'</div>')+'</div>';
    box.querySelectorAll('[data-om] button').forEach(function(b){ b.onclick=function(){ var k=b.parentNode.dataset.om; if(k==='m') OVS.m=b.dataset.v; else OVS.r=+b.dataset.v; draw(box,o); }; }); }
  function mount(d){ var b=$('#cardBody'), bar=b&&b.querySelector('.ctabs'); if(!b||!bar||b.querySelector('#ovMain')) return; var box=document.createElement('div'); box.id='ovMain'; box.innerHTML='<div class="skel"></div>'; b.insertBefore(box,bar.nextSibling);
    var vis=function(){ box.style.display=CTAB==='over'?'':'none'; }; vis(); var g0=window.__ctGo; if(g0&&!g0.__om){ window.__ctGo=function(k){ g0(k); vis(); }; window.__ctGo.__om=1; } bar.addEventListener('click',function(){ setTimeout(vis,0); });
    var nm=d.name, show=function(o){ if(document.getElementById('ovMain')===box) draw(box,o); };
    if(OVC[nm]) show(OVC[nm]); gsr('dashboardOverview',nm).then(function(o){ OVC[nm]=o; show(o); }).catch(function(e){ if(!OVC[nm]) box.innerHTML='<div class="om-e">'+esc(e.message||String(e))+'</div>'; }); }
  var _ct=cardTabs; cardTabs=function(d){ var r=_ct.apply(this,arguments); try{ mount(d); }catch(e){} return r; };
})();
</script>
