<!DOCTYPE html>
<html dir="rtl" lang="he"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בונה תפריטים ותוכניות · AVIEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#1c1f24;--mute:#6b7079;--line:#dde3e7;--line2:#eaeff2;--acc:#1f4e5f;--acc-l:#e6eef1;--ok:#1e7a4f;--ok-l:#e5f3ec;--warn:#a5620d;--warn-l:#fdf2e2;--bad:#b42318;--bad-l:#fdecea;--p:#2563a8;--c:#b7791f;--f:#8b4c9e;--sh:0 1px 2px rgba(20,20,20,.05),0 6px 18px -10px rgba(20,20,20,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Heebo,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-weight:600}
button:hover{background:#f4f7f9}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.p:hover{background:#173d4b}
button.g{border-color:transparent;background:transparent;color:var(--mute);padding:5px 8px}
button.g:hover{background:var(--line2);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header .brand{font-weight:800;letter-spacing:.06em;color:var(--acc)}
header select{min-width:180px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--line2);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 14px}
.tabs button.on{background:#fff;box-shadow:var(--sh);color:var(--acc)}
header .sp{flex:1}
header a{color:var(--mute);font-size:13.5px;text-decoration:none}
header a:hover{color:var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px max(16px,env(safe-area-inset-left)) 120px;max-width:1280px;margin:0 auto}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.pad{padding:14px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.muted{color:var(--mute);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.upl{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer}
.upl input{display:none}
/* totals */
.tot .row{display:grid;grid-template-columns:60px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:13.5px}
.track{height:7px;border-radius:9px;background:var(--line2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.tot .big{font-size:26px;font-weight:800}
.tot .of{color:var(--mute);font-size:13px}
.rng{color:var(--mute);font-size:12px}
/* meals */
.meal{margin-bottom:14px}
.mh{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.mh input.t{font-weight:700;font-size:16px;border-color:transparent;flex:1}
.mh input.t:hover{border-color:var(--line)}
.mh .kc{font-size:13px;color:var(--mute);white-space:nowrap}
.rw{padding:10px 14px;border-bottom:1px solid var(--line2)}
.rw:last-of-type{border-bottom:0}
.rwh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rwh input.lbl{width:150px;font-weight:600;font-size:13.5px;color:var(--acc)}
.rwh .hint{font-size:12px;color:var(--mute);flex:1}
.op{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 46px 210px 28px;gap:8px;align-items:center;padding:4px 0}
.op .ix{font-size:12px;color:var(--mute);text-align:center}
.op.alt .ix{color:var(--acc)}
.op .g input{width:100%;text-align:center}
.op .u{font-size:12px;color:var(--mute)}
.mac{display:flex;gap:10px;font-size:12.5px;justify-content:flex-end;white-space:nowrap}
.mac b{font-weight:700}
.mac .p{color:var(--p)}.mac .c{color:var(--c)}.mac .f{color:var(--f)}
.op.unm .fs input{background:var(--warn-l);border-color:#f0c88a}
.rwf{display:flex;gap:6px;margin-top:6px}
.mf{display:flex;gap:8px;padding:10px 14px;background:#f6f9fa;border-top:1px solid var(--line2);border-radius:0 0 14px 14px}
/* autocomplete */
.fs{position:relative}
.fs input{width:100%}
.ac{position:absolute;top:calc(100% + 4px);right:0;left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.25);max-height:320px;overflow:auto}
.ac div{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.ac div.on,.ac div:hover{background:var(--acc-l)}
.ac small{color:var(--mute);white-space:nowrap}
.ac .src{font-size:10.5px;color:#fff;background:var(--acc);border-radius:5px;padding:0 5px;margin-inline-start:6px}
/* program */
.day{margin-bottom:14px}
.ex{display:grid;grid-template-columns:22px minmax(0,1.6fr) 92px 54px 74px 62px 54px 28px;gap:6px;align-items:center;padding:5px 14px}
.ex.head{font-size:12px;color:var(--mute);padding-top:10px}
.ex input{width:100%;text-align:center}
.ex .fs input{text-align:right;font-weight:600}
.ex .mu{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .mv{display:flex;flex-direction:column}
.ex .mv button{padding:0 4px;line-height:1;font-size:11px;border:0;background:transparent;color:var(--mute)}
.ex .mv button:hover{color:var(--acc)}
.exn{padding:0 14px 6px 50px}
.ex .mu{display:flex;align-items:center;gap:6px}
.exi{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;background:#fff}
.exn input{width:100%;font-size:13px;border-style:dashed}
.swp{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 8px 50px}
.swp button{font-size:12.5px;padding:4px 8px}
.vol .row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}
.vol .lo{color:var(--warn)}.vol .hi{color:var(--bad)}
button.send{width:100%;margin-top:12px;padding:10px;background:var(--ok-l);border-color:#b5dcc6;color:var(--ok)}
button.send:hover{background:#d8eee2}
.guide{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.guide ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.guide li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);background:var(--line2);border-radius:99px;padding:4px 10px 4px 12px}
.guide li i{font-style:normal;font-weight:800;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:12px}
.guide li.ok{color:var(--ok);background:var(--ok-l)}.guide li.ok i{background:var(--ok);color:#fff}
.guide li.now{color:#fff;background:var(--acc)}.guide li.now i{color:var(--acc)}
.guide .do{font-size:16px;font-weight:700}
.guide .do small{display:block;font-weight:400;color:var(--mute);font-size:13.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}
.toast.err{background:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--mute)}
.chip.w{background:var(--warn-l);color:var(--warn)}
.gate{max-width:420px;margin:12vh auto;padding:24px;text-align:center}
.gate input{width:100%;margin:12px 0}
@media (max-width:900px){
 main{grid-template-columns:1fr}
 .side{position:static}
 .op{grid-template-columns:18px minmax(0,1fr) 64px 26px;row-gap:2px}
 .op .u{display:none}.op .mac{grid-column:2/4;justify-content:flex-start}
 .ex{grid-template-columns:18px minmax(0,1fr) 54px 54px 26px}
 .ex .mu,.ex .rest,.ex .inc,.ex.head{display:none}
 .exn,.swp{padding-right:14px;padding-left:14px}
}
</style></head><body>
<div id="app"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbxSkxJJ1ODs067IOfDkuosXzKX-pVi2W7uTcWKAS-7YFuh8PW9mrjSS8bNC4SaiRTkP/exec';
var DATA='../data/';
var Q=new URLSearchParams(location.search);
var K=Q.get('k')||lsg('coach_k','');
if(Q.get('k')) lss('coach_k',Q.get('k'));
var DONE={};
var S={tab:Q.get('tab')==='prog'?'prog':'menu', client:Q.get('c')||lsg('coach_c',''), clients:[], foods:[], coach:[], moh:[], ex:[], msug:null, psug:null, M:null, P:null, by:'k', mstore:null, pstore:null, busy:false};
function lsg(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lss(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function r1(x){ return Math.round((+x||0)*10)/10; }
function kc(m){ return Math.round(4*(+m[0]||0)+4*(+m[1]||0)+9*(+m[2]||0)); }
function toast(t,err){ var e=document.createElement('div'); e.className='toast'+(err?' err':''); e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); },err?5000:2600); }
function call(fn){ var args=[].slice.call(arguments,1); return fetch(API,{method:'POST',body:JSON.stringify({api:'coach',k:K,fn:fn,args:args})}).then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw new Error(j.error||'שגיאה'); return j.r; }); }

/* ===== מאגרי מזון ותרגילים ===== */
function allFoods(){ // [name,p,c,f,kcal,src]
  var seen={}, out=[]; S.coach.forEach(function(f){ if(!seen[f[0]]){ seen[f[0]]=1; out.push([f[0],+f[1]||0,+f[2]||0,+f[3]||0,+f[4]||kc([f[1],f[2],f[3]]),'שלי']); } });
  S.foods.forEach(function(f){ if(!seen[f[0]]){ seen[f[0]]=1; out.push([f[0],+f[1]||0,+f[2]||0,+f[3]||0,kc([f[1],f[2],f[3]]),'בסיס']); } });
  S.moh.forEach(function(f){ if(!seen[f[0]]){ seen[f[0]]=1; out.push([f[0],+f[1]||0,+f[2]||0,+f[3]||0,Math.round(+f[4]||kc([f[1],f[2],f[3]])),'']); } });
  return out; }
var FOODS_CACHE=null; function foods(){ if(!FOODS_CACHE) FOODS_CACHE=allFoods(); return FOODS_CACHE; }
function norm(s){ return String(s||'').replace(/[,()'"׳״]/g,' ').replace(/([0-9]+) ?אחוז/,'$1%').replace(/ +/g,' ').trim(); }
function searchFoods(q,limit){ q=norm(q); if(q.length<2) return []; var pct=(q.match(/[0-9.]+%/)||[''])[0], ws=q.replace(/[0-9.]+%/,' ').split(' ').filter(function(w){ return w.length>1; }); if(!ws.length&&!pct) return [];
  var sc=function(n){ var h=norm(n), s=0; if(h.indexOf(ws[0]||'')===0) s+=4; if(h.indexOf(q)===0) s+=3; ws.forEach(function(w){ if(h.indexOf('לא '+w)>=0) s-=6; }); if(pct){ var at=h.indexOf(pct); if(at>=0&&!/[0-9.]/.test(h.charAt(at-1)||'')) s+=6; else if(/[0-9]%/.test(h)) s-=3; } if(/מיובש|אבקה|משומר|כבוש|בסירופ|מטוגן|בציפוי|FFQ|ממרח/.test(h)&&!/מיובש|אבקה|משומר|כבוש|סירופ|מטוגן|ציפוי|ממרח/.test(q)) s-=3; if(/טרי/.test(h)) s+=1; if(/ עם | ב?רוטב|מוקפצ|סגנון|ממולא|פשטידה|עוגה|סלט /.test(h)&&!/ עם |רוטב|סלט/.test(q)) s-=3; if(/ או /.test(h)) s-=1.5; if(h===q||h.indexOf(q+' ')===0||h.indexOf(q+',')===0) s+=4; return s-h.length/14; };
  var hits=foods().filter(function(f){ var h=norm(f[0]); return ws.every(function(w){ return h.indexOf(w)>=0; }); });
  return hits.map(function(f){ return {f:f,s:sc(f[0])+(f[5]==='שלי'?3:f[5]==='בסיס'?1:0)}; }).sort(function(a,b){ return b.s-a.s; }).slice(0,limit||12).map(function(x){ return x.f; }); }
function findFood(name){ var n=norm(name); return foods().filter(function(f){ return norm(f[0])===n; })[0]||null; }
function searchEx(q){ q=norm(q); if(q.length<2) return S.ex.slice(0,0); var ws=q.split(' ').filter(Boolean); return S.ex.filter(function(x){ var h=norm(x[2]); return ws.every(function(w){ return h.indexOf(w)>=0; }); }).sort(function(a,b){ return (norm(b[2]).indexOf(ws[0])===0)-(norm(a[2]).indexOf(ws[0])===0)||a[2].length-b[2].length; }).slice(0,12); }
var MU_RE=[['יד אחורית',/פשיטת מרפק|יד אחורית|טרייספס/],['יד קדמית',/כפיפת מרפק|יד קדמית|בייספס/],['תאומים',/תאומים/],['בטן',/בטן|הרמת ברכיים|פלאנק/],['כתפיים',/כתפ|פרפר הפוך/],['חזה',/לחיצת חזה|פרפר חזה|חזה|מקבילים|שכיבות סמיכה/],['המסטרינג',/כפיפת ברך|דדליפט|RDL|כיסא רומי/],['ישבן',/ישבן|גשר|היפ תראסט|הרחקת ירך/],['ארבע ראשי',/סקוואט|לחיצת רגליים|פשיטת ברך|מכרע|לאנג/],['גב',/פולי|חתירה|מתח|פול דאון|גב|סופרמן/]];
function muOf(e){ if(e.mu) return e.mu; var x=S.ex.filter(function(r){ return r[2]===e.n; })[0]; if(x) return x[0]; var h=MU_RE.filter(function(m){ return m[1].test(e.n||''); })[0]; return h?h[0]:''; }

/* ===== אוטו-השלמה ===== */
var AC=null;
function closeAC(){ if(AC){ AC.box.remove(); AC=null; } }
function openAC(input,kind,onPick){ closeAC(); var box=document.createElement('div'); box.className='ac'; input.parentNode.appendChild(box); AC={box:box,input:input,kind:kind,onPick:onPick,i:0,list:[]}; fillAC(); }
function fillAC(){ if(!AC) return; var q=AC.input.value, L=AC.kind==='ex'?searchEx(q):searchFoods(q); AC.list=L; AC.i=0;
  if(!L.length){ AC.box.innerHTML=q.trim().length>=2?'<div style="cursor:default;color:var(--mute)">לא נמצא. '+(AC.kind==='ex'?'אפשר להשאיר את השם כמו שהוא.':'אפשר להוסיף למאגר שלך למטה.')+'</div>':''; if(!q.trim()) closeAC(); return; }
  AC.box.innerHTML=L.map(function(x,i){ return AC.kind==='ex'?'<div data-i="'+i+'"><span>'+esc(x[2])+'</span><small>'+esc(x[0])+'</small></div>':'<div data-i="'+i+'"><span>'+esc(x[0])+(x[5]?'<span class="src">'+x[5]+'</span>':'')+'</span><small class="num">'+x[4]+' קק״ל · ח '+r1(x[1])+' · פ '+r1(x[2])+' · ש '+r1(x[3])+'</small></div>'; }).join('');
  hiAC(); }
function hiAC(){ if(!AC) return; [].forEach.call(AC.box.children,function(d,i){ d.classList.toggle('on',i===AC.i); }); }
document.addEventListener('mousedown',function(e){ if(!AC) return; var d=e.target.closest&&e.target.closest('.ac div[data-i]'); if(d){ e.preventDefault(); var x=AC.list[+d.dataset.i], cb=AC.onPick; closeAC(); cb(x); return; } if(!e.target.closest||!e.target.closest('.ac')) if(e.target!==AC.input) closeAC(); });
document.addEventListener('keydown',function(e){ if(!AC||e.target!==AC.input) return; if(e.key==='ArrowDown'){ AC.i=Math.min(AC.list.length-1,AC.i+1); hiAC(); e.preventDefault(); } else if(e.key==='ArrowUp'){ AC.i=Math.max(0,AC.i-1); hiAC(); e.preventDefault(); } else if(e.key==='Enter'&&AC.list[AC.i]){ var x=AC.list[AC.i], cb=AC.onPick; closeAC(); cb(x); e.preventDefault(); } else if(e.key==='Escape') closeAC(); });

/* ===== תפריט: מודל ===== */
function emptyMenu(T){ return {T:T||1700, free:0, notes:'', meals:[['ארוחת בוקר'],['ארוחת ביניים'],['ארוחת צהריים'],['ארוחת ערב']].map(function(t){ return {title:t[0], rows:[{label:'חלבון',opts:[]},{label:'פחמימה',opts:[]}]}; })}; }
function optFrom(f,g){ var per=[f[1],f[2],f[3]]; g=Math.max(0,Math.round(+g||0)); return {t:g+' גרם '+f[0], food:f[0], g:g, per:per, m:per.map(function(x){ return x*g/100; }), k100:f[4]}; }
function setG(o,g){ g=Math.max(0,Math.round(+g||0)); o.g=g; if(o.per){ o.m=o.per.map(function(x){ return x*g/100; }); o.t=g+' גרם '+o.food; } }
function matchG(base,f){ // גרמים לחלופה: אותן קלוריות (או אותו חלבון)
  if(!base||!base.m) return 100; var tgt=S.by==='p'?base.m[0]:kc(base.m), per=S.by==='p'?f[1]:(f[4]||kc([f[1],f[2],f[3]])); if(!(per>0)||!(tgt>0)) return 100; var g=tgt/per*100; return Math.max(5,Math.round(g/5)*5); }
function rowRange(r){ var o=r.opts.filter(function(x){ return x.m&&(x.m[0]||x.m[1]||x.m[2]); }); if(!o.length) return null; var ks=o.map(function(x){ return [kc(x.m),x.m[0],x.m[1],x.m[2]]; }); var lo=[0,1,2,3].map(function(i){ return Math.min.apply(null,ks.map(function(z){ return z[i]; })); }), hi=[0,1,2,3].map(function(i){ return Math.max.apply(null,ks.map(function(z){ return z[i]; })); }); return {lo:lo,hi:hi}; }
function totals(M){ var lo=[0,0,0,0], hi=[0,0,0,0]; M.meals.forEach(function(ml){ ml.rows.forEach(function(r){ var R=rowRange(r); if(R) for(var i=0;i<4;i++){ lo[i]+=R.lo[i]; hi[i]+=R.hi[i]; } }); }); lo[0]+=+M.free||0; hi[0]+=+M.free||0; return {lo:lo,hi:hi}; }
function mealK(ml){ var lo=0,hi=0; ml.rows.forEach(function(r){ var R=rowRange(r); if(R){ lo+=R.lo[0]; hi+=R.hi[0]; } }); return lo===hi?String(Math.round(lo)):Math.round(lo)+'–'+Math.round(hi); }
function saveDraft(){ if(S.client&&S.M) lss('coach_draft_menu_'+S.client,S.M); if(S.client&&S.P) lss('coach_draft_prog_'+S.client,S.P); }
function fromStored(M){ // מתפריט שמור/מיובא לפורמט הבונה
  M.meals=(M.meals||[]).map(function(ml){ return {title:ml.title||'', note:ml.note||'', rows:(ml.rows||[]).map(function(r){ return {label:r.label||'', alt:!!r.alt, opts:(r.opts||[]).map(function(o){
    if(o.food&&o.per) return {t:o.t, food:o.food, g:o.g, per:o.per, m:o.per.map(function(x){ return x*o.g/100; })};
    if(o.food&&o.g){ var f=findFood(o.food); if(f) return optFrom(f,o.g); return {t:o.t, raw:o.food, g:o.g, m:[0,0,0], unm:1}; }
    if(o.m&&(o.m[0]||o.m[1]||o.m[2])) return {t:o.t, m:o.m};
    return {t:o.t, raw:o.t, g:0, m:[0,0,0], unm:1}; })}; })}; });

function loadProgCtx(){ var c=S.client; S.P=lsg('coach_draft_prog_'+c,null); S.psug=null;
  call('dashboardProgramSuggest',c).then(function(r){ if(S.client!==c) return; S.psug=r; if(!S.P) S.P=emptyProg(r.n||3); render(); }).catch(function(e){ if(!S.P) S.P=emptyProg(3); render(); toast(e.message,1); });
  if(!S.pstore) call('dashboardProgStoreList').then(function(r){ S.pstore=r; render(); }).catch(function(){}); }
function pickClient(n){ S.client=n; lss('coach_c',n); SWAP=null; history.replaceState(null,'','?tab='+S.tab+(n?'&c='+encodeURIComponent(n):'')); S.M=null; S.P=null; if(n){ loadMenuCtx(); loadProgCtx(); } render(); }
function boot(){ render();
  fetch(DATA+'foods-moh.json').then(function(r){ return r.json(); }).then(function(d){ S.moh=d; FOODS_CACHE=null; }).catch(function(){});
  fetch(DATA+'exercise-images.json').then(function(r){ return r.json(); }).then(function(d){ EXI=d; if(S.tab==='prog') render(); }).catch(function(){});
  fetch(DATA+'exercise-library.json').then(function(r){ return r.json(); }).then(function(d){ S.ex=d; if(S.tab==='prog') render(); }).catch(function(){});
  if(!K) return;
  call('dashboardList').then(function(r){ S.clients=(r.clients||r||[]).filter(function(c){ return c.name; }); render(); }).catch(function(e){ if(/מפתח/.test(e.message)){ K=''; lss('coach_k',''); } render(); toast(e.message,1); });
  call('dashboardCoachFoods').then(function(r){ S.coach=r||[]; FOODS_CACHE=null; }).catch(function(){});
  call('dashboardBaseFoods').then(function(r){ (r||[]).forEach(function(f){ if(!S.foods.some(function(x){ return x[0]===f[0]; })) S.foods.push(f); }); FOODS_CACHE=null; }).catch(function(){});
  if(S.client){ loadMenuCtx(); loadProgCtx(); } }
boot();
</script>
